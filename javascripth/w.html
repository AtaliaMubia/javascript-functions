<!DOCTYPE html>
<html>
    <body>
        <p>multipication h/w:</p>
        <button type="button" onclick="myFunction()">Click me!</button>
        <p id="num"></p>
        <p id="num1"></p>
        <p id="num2"></p>
        <p id="num3"></p>
        <script>
            var b = 5;
            var a = 4;
            var c = 6;
            function myFunction(){
                document.getElementById("num").innerHTML = b * a * c;
            }
            document.getElementById("num1").innerHTML = a;
            document.getElementById("num2").innerHTML = b;
            document.getElementById("num3").innerHTML = c;
        </script>
    </body>
</html>
